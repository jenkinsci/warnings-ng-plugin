description.files=<a rel="noopener noreferrer" href="{0}">Fileset ''includes''</a> setting that specifies the workspace files to \
  scan for grep matches, such as '**/*.log'.
description.exclude.files=<a rel="noopener noreferrer" href="{0}">Fileset ''excludes''</a> setting that specifies the workspace files to \
  exclude from scanning.
description.regexp=A Java regular expression that will be matched against each line of the scanned files. \
  Every line that matches will be reported as an issue. Use capturing groups ($1, $2, ...) in the \
  message template to extract parts of the match.
description.severity=The severity to assign to each matched issue (High, Normal, or Low).
description.message=Optional message template for matched issues. You may reference regex capturing groups \
  using $1, $2, etc. When left blank, the full matched line is used as the issue message.
description.example=Enter example text that will be scanned with the pattern configured above. \
  This allows you to verify your pattern before saving the configuration.
