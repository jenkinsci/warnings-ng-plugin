description=Description
baselines-title=Baselines
baselines-intro=The issues of a build are classified by comparing them with the issues of the reference build \
  (see below). The baseline can be selected on several pages of the Warnings tab (e.g., Issues, Hotspots, and \
  Treemap) and in the URLs of the remote API.
baseline=Baseline
severities-title=Severities
severities-intro=Each issue has a severity. The severity is reported by the analysis tool, or it is derived from \
  the priority or category of the issue in the report. The severity can be used to filter the issues and to define \
  the quality gates.
severity=Severity
quality-gates-title=Quality gates
quality-gates-intro=A quality gate defines a threshold for a number of issues. If this number reaches the \
  threshold, then the quality gate is missed. The quality gates are evaluated for each tool when the results are \
  recorded, the results are shown on the Overview page.
quality-gate=Type
criticalities-intro=The criticality of a quality gate defines what happens with the step and the build if the \
  quality gate is missed. Freestyle jobs support the criticalities UNSTABLE and FAILURE only.
result=Criticality
reference-build-title=Reference build
reference-build-intro=The reference build (baseline) is used to compute the new, outstanding, and fixed issues and \
  the delta quality gates. The selection of the reference build is delegated to the Forensics API plugin: invoke \
  the step discoverReferenceBuild before recording the issues. Without this step, all issues are considered \
  outstanding.
reference-build-quality-gate=By default, the reference build is a build that passed all quality gates. As soon \
  as a build misses a quality gate, the reference build is frozen until all new issues have been resolved. Set the \
  option ignoreQualityGate to always use the previous build as reference build instead.
reference-build-missing=If no reference build has been found, then the log messages of a tool contain the reason \
  (see page Log Messages).
more-title=More information
more-intro=The configuration of the recording step, the quality gates, the selection of the reference build, and \
  the supported report formats are described in the
documentation=Warnings Plugin documentation
