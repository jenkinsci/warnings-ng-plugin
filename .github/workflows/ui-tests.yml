name: 'UI Tests'

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ui-tests:
    strategy:
      fail-fast: false
      matrix:
        test: [ DetailsTabUiTest, FreeStyleConfigurationUiTest, GlobalConfigurationUiTest, IssuesColumnUiTest, SnippetGeneratorUiTest, TrendChartsUiTest, WarningsPluginUiTest, SmokeTests ]
        browser: [ firefox-container, chrome-container ]

    runs-on: [ubuntu-latest]
    name: '${{ matrix.browser }} / ${{ matrix.test }}'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true
          cache: 'maven'
      - name: Build warnings plugin and download dependencies
        run: ./mvnw -V --color always -ntp verify -Pskip --file plugin/pom.xml
      - name: Run UI tests ${{ matrix.test }} on ${{ matrix.browser }}
        run: ./mvnw -V --color always -ntp test --file ui-tests/pom.xml -Dbrowser=${{ matrix.browser }} -Dtest=${{ matrix.test }} -Dquite -Dgpg.skip -Dsurefire.rerunFailingTestsCount=1
